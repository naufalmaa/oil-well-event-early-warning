[project]
name = "oil_well_event_early_warning"
version = "0.1.0"
description = "Early warning of undesirable events in offshore oil wells, tested on wells the model has never seen"
authors = [{ name = "Naufal MA" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=16",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "matplotlib>=3.9",
  "pandera>=0.20",
  "pyyaml>=6.0",
  "requests>=2.32",
  "tqdm>=4.66",
]

[project.optional-dependencies]
# Install with: uv sync --extra explain --extra tracking --extra tuning
explain = ["shap>=0.45"]
tracking = ["mlflow>=2.14"]
tuning = ["optuna>=3.6"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "pre-commit>=3.7",
  "nbstripout>=0.7",
  "jupyterlab>=4.2",
  "ipykernel>=6.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/oil_well_event_early_warning"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-include = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PD", "NPY"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
